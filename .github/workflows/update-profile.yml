name: Update profile graphics

on:
  schedule:
    - cron: "17 6 * * *"   # daily
  workflow_dispatch:
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - "source-photo.*"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Render SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/contributions.py
          python scripts/terminal_card.py
          SRC=$(ls source-photo.* 2>/dev/null | head -1)
          if [ -n "$SRC" ]; then python scripts/ascii_portrait.py "$SRC" ascii-portrait.svg; fi
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A *.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile graphics"
          git pull --rebase origin main
          git push
